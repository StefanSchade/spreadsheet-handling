  Maintainer-prepared implementation WorkItem for the accepted Relation-Key
  Identity Cycle-0 Slice 3a ("Lookup enrichment, duplicate, and mismatch
  delegation"), per
  docs/warm_storage/global_reviews/relation_key_identity_dmc_cycle0_assessment_2026-09-18.adoc
  (corrected assessment, Cycle-0 review loop closed by
  relation_key_identity_dmc_cycle0_assessment_2026-09-18_review_002.adoc,
  verdict A), the independently accepted Slice 1 semantic owner
  (relation_key_identity_slice1_semantic_owner_implementation_review_2026-09-25_review_002.adoc,
  verdict A -- SLICE 1 ACCEPTED, commit efe3187b), and the independently
  accepted Slice 2 FK delegation
  (relation_key_identity_slice2_fk_delegation_implementation_review_2026-09-25.adoc,
  verdict A -- SLICE 2 ACCEPTED, commit 6ade55a6), with the FK Cycle-3
  lifecycle alignment already completed in commit 47f332e1 (out of scope
  here; already done). Preparation-time source inspection of the current
  Lookup call path found: `enrich_lookup/operation.py`'s value-mode merge
  (`source_df.merge(helper_cols, on=source_keys, how="left")`) and
  `enrich_lookup/policy.py`'s `_lookup_frame_has_duplicate_keys`
  (`lookup_df.duplicated(subset=join_keys, keep=False).any()`) both interpret
  relation-key identity through raw pandas mechanics with no owner
  delegation; `enrich_lookup/mismatch.py` has one private `_norm` used for
  two distinct purposes -- building relation-key lookup tuples (identity,
  must delegate) and comparing a materialized helper cell's displayed value
  against the target row's stored value (Lookup-owned payload mechanics, not
  identity, per the assessment's disposition table) -- that must be split.
  `enrich_lookup/provenance.py` and
  `domain/transformations/derived_column_policy.py` were inspected and found
  to contain no key-identity interpretation of their own (DCP delegates
  entirely to `evaluate_lookup_mismatches`); they are therefore out of scope
  except for DCP's test file, whose fixtures exercise the changed mismatch
  behavior indirectly. This preparation commit does not authorize provider
  execution.
