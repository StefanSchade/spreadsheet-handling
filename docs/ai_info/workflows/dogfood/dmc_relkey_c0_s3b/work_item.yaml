authority_source: >-
  Maintainer-prepared implementation WorkItem for the accepted Relation-Key
  Identity Cycle-0 Slice 3b ("reference and graph relation-key validation
  delegation"), per
  docs/warm_storage/global_reviews/relation_key_identity_dmc_cycle0_assessment_2026-09-18.adoc
  (corrected assessment, Cycle-0 review loop closed by
  relation_key_identity_dmc_cycle0_assessment_2026-09-18_review_002.adoc,
  verdict A), the independently accepted Slice 1 semantic owner
  (relation_key_identity_slice1_semantic_owner_implementation_review_2026-09-25_review_002.adoc,
  verdict A -- SLICE 1 ACCEPTED, commit efe3187b), the independently accepted
  Slice 2 FK delegation
  (relation_key_identity_slice2_fk_delegation_implementation_review_2026-09-25.adoc,
  verdict A -- SLICE 2 ACCEPTED, commit 6ade55a6), and the independently
  accepted Slice 3a Lookup delegation
  (relation_key_identity_slice3a_lookup_delegation_implementation_review_2026-09-25_review_002.adoc,
  verdict A -- SLICE 3a ACCEPTED, commit ffdfa60f6dca6260a97353f5f3c23ec50ef8c482),
  read only as pattern precedent (Slice 3a's Lookup/pandas-boundary mechanics
  do not authorize touching any Slice-1/2/3a file here). Preparation-time
  source inspection of the current reference/graph validation call path
  found: `reference_validations.py::_validate_foreign_key` builds its
  `target_keys` set and performs membership resolution through the local
  `_key_token` string-stringification helper (no owner delegation), and
  `_duplicate_findings` -- the shared duplicate-counting helper used by all
  three of `_validate_unique`, `_validate_primary_key`, and
  `_validate_unique_reference` -- also resolves duplicate identity through
  the same local `_key_token`, so `primary_key` duplicate detection must be
  split onto owner-defined relation-key identity while `unique` and
  `unique_reference` duplicate detection must keep the current generic
  `_key_token` mechanics unchanged. `graph_validations.py::_endpoint_findings`
  (via `_key_set` for node membership and directly for source/target
  membership checks) also resolves relation identity through its own local
  `_key_token`/`_plain_value` copy, while `_unique_edge_findings` uses the
  same local `_key_token` for generic edge-tuple uniqueness, including the
  W4 default-`unique_columns`-equals-endpoint-columns case recorded by the
  accepted delta re-review, which must retain its current tuple-token
  identity (stringified, blank-participating) even though the same physical
  endpoint columns are, after this slice, also resolved through relation-key
  identity for `endpoints_exist`. `_plain_value` in both files unwraps
  NumPy `.item()` and folds recognized-empty carriers to `None` before any
  key use; per the accepted assessment this pre-collapse must no longer be
  the thing that decides relation-key Missing/identity on the delegating
  paths, though it may remain for non-key roles (row-index label
  preservation, `enabled_when`/`when` condition evaluation, generic-tuple
  display) that this WorkItem does not otherwise touch. This preparation
  commit does not authorize provider execution.
