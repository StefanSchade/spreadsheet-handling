schema_version: 1
purpose: bounded consumer-neutral Slice-5B convergence fixture
work_item:
  schema_version: 1
  work_item_id: WI-GENERIC-5B
  authority_source: deterministic local acceptance
  profile_ref: profile.yml
  repository: repo
  scope: [payload.txt, review/report.md]
  initial_phase: investigate
  max_autonomous_hops: 4
  durable_artifacts:
    review: [review/report.md]
repository_policy:
  schema_version: 3
  policy_id: generic-local
  revision: "1"
  scope: [repo]
  governance_paths: [work.yml, profile.yml, policy.yml, components.yml, task.txt, generic_agent.txt]
  work_item_scope_ceiling: [payload.txt, review/report.md]
  max_autonomous_hops: 4
  actions: [edit, commit, review]
  evidence_commands:
    fake_check:
      argv: [git, --version]
      timeout_seconds: 10
profile:
  schema_version: 1
  profile_id: generic-convergence
  revision: "1"
  phases:
    investigate:
      role: investigator
      components: {role: [generic_agent], modifiers: [], repository_policy: []}
      durable_artifact: optional
      authorized_scope: [payload.txt]
      authorized_actions: [edit, commit]
      human_gates: []
      evidence: [fake_check]
      review: null
      routes:
        review: {effect: goto, target: review}
    review:
      role: independent_reviewer
      components: {role: [generic_agent], modifiers: [], repository_policy: []}
      durable_artifact: required
      authorized_scope: [review/report.md]
      authorized_actions: [edit, commit, review]
      human_gates: []
      evidence: [fake_check]
      review:
        purpose: independent falsification
        breadth: focused
        authority: gate
        context: fresh
        blocking_policy: blocking_only
        trigger: profile_selected
        exit: declared_route
        finding_authority: [resolve]
        failed_evidence_route: correct
      routes:
        correct: {effect: goto, target: correct}
    correct:
      role: corrector
      components: {role: [generic_agent], modifiers: [], repository_policy: []}
      durable_artifact: optional
      authorized_scope: [payload.txt]
      authorized_actions: [edit, commit]
      human_gates: []
      evidence: [fake_check]
      review: null
      routes:
        rereview: {effect: goto, target: rereview}
    rereview:
      role: independent_rereviewer
      components: {role: [generic_agent], modifiers: [], repository_policy: []}
      durable_artifact: none
      authorized_scope: [review/report.md]
      authorized_actions: [review]
      human_gates: []
      evidence: [fake_check]
      review:
        purpose: fresh disposition
        breadth: focused
        authority: gate
        context: fresh
        blocking_policy: blocking_only
        trigger: profile_selected
        exit: declared_route
        finding_authority: [resolve]
      routes:
        accept: {effect: complete}
        correct: {effect: goto, target: correct}
components:
  schema_version: 1
  components:
    generic_agent: {path: generic_agent.txt}
task: Investigate the bounded generic payload, obtain independent review, correct it, and seek fresh re-review.
